<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Event</title>

    <link rel="stylesheet" href="../Css/global.css" />
    <link rel="stylesheet" href="../Css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container navbar-content">
        <a href="index.html" class="nav-logo">🎓 Smart Event Portal</a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="EventListing.html">Events</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="feedbackForm.html">Contact & Feedback</a></li>
          <li><button id="themeToggle" class="theme-btn">🌓</button></li>
        </ul>
      </div>
    </nav>

    <div class="form-container">
      <h1>Event Registration</h1>

      <div
        id="eventDescriptionDisplay"
        style="
          margin: 20px 0;
          padding: 15px;

          background: rgba(255, 255, 255, 0.05);
          font-style: italic;
          line-height: 1.5;
        "
      ></div>

      <form id="registrationForm">
        <input type="text" id="fullName" placeholder="Full Name" required />

        <input type="email" id="email" placeholder="Email" required />

        <input type="tel" id="phone" placeholder="Phone Number" required />

        <input type="text" id="college" placeholder="College Name" required />

        <select id="gender" required>
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>

        <input type="text" id="eventName" readonly />

        <input type="text" id="eventCategory" readonly />
        <input type="date" id="eventDate" readonly />

        <button type="submit">Register</button>
      </form>

      <p id="successMessage"></p>
    </div>

    <footer class="footer">
      <div class="container">
        <p>Made with ❤ @Acuvate</p>
        <p>&copy; 2026 Smart Event Portal. All rights reserved.</p>
        <p>
          Contact us at
          <a href="mailto:info@smarteventportal.com"
            >info@smarteventportal.com</a
          >
        </p>
      </div>
    </footer>

    <script>
      let registrations =
        JSON.parse(localStorage.getItem("registrations")) || [];
      const selectedEvent = JSON.parse(localStorage.getItem("selectedEvent"));

      document.getElementById("eventName").value = selectedEvent.eventName;
      document.getElementById("eventDescriptionDisplay").innerHTML =
        selectedEvent.description;

      document.getElementById("eventCategory").value =
        selectedEvent.eventCategory;
      document.getElementById("eventDate").value = selectedEvent.eventDate;

      const registrationForm = document.getElementById("registrationForm");

      registrationForm.addEventListener("submit", function (e) {
        e.preventDefault();

        const registration = {
          registrationId: Date.now(),

          fullName: document.getElementById("fullName").value,

          email: document.getElementById("email").value,

          phone: document.getElementById("phone").value,

          college: document.getElementById("college").value,

          gender: document.getElementById("gender").value,

          eventId: selectedEvent.id,
          eventName: selectedEvent.eventName,
          eventCategory: selectedEvent.eventCategory,
          eventDate: selectedEvent.eventDate,
        };

        registrations.push(registration);

        localStorage.setItem("registrations", JSON.stringify(registrations));

        document.getElementById("successMessage").innerText =
          "Registration Successful";

        console.log(registrations);

        registrationForm.reset();

        document.getElementById("eventName").value = selectedEvent.eventName;

        document.getElementById("eventCategory").value =
          selectedEvent.eventCategory;

        document.getElementById("eventDate").value = selectedEvent.eventDate;

        // redirect to the home page after 1.5 seconds
        setTimeout(() => {
          window.location.href = "EventListing.html";
        }, 1500);
      });

      document.addEventListener("DOMContentLoaded", () => {
        const themeBtn = document.getElementById("themeToggle");
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
        themeBtn.addEventListener("click", () => {
          const current = document.documentElement.getAttribute("data-theme");
          const target = current === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", target);
          localStorage.setItem("theme", target);
        });
      });
    </script>
  </body>
</html>
