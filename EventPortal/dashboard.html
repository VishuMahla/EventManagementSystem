<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Smart Event Portal</title>
    <link rel="stylesheet" href="../Css/global.css" />
    <link rel="stylesheet" href="../Css/EventListingAndSearching.css" />
    <style>
      .dashboard-container {
        padding: 50px 20px;
        max-width: 1100px;
        margin: auto;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }
      .stat-card {
        background: rgba(15, 23, 42, 0.85);
        padding: 30px;
        border-radius: 15px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: left;
      }
      .stat-card h3 {
        margin: 0;
        font-size: 0.9rem;
        color: #ff7b00;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .stat-card .value {
        font-size: 2.2rem;
        font-weight: 800;
        margin: 10px 0;
        color: white;
      }
      #countdown {
        font-family: monospace;
        color: #ff7b00;
      }
      .reg-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }
      [data-theme="light"] .stat-card {
        background: #fff;
        border: 1px solid #ddd;
      }
      [data-theme="light"] .stat-card .value {
        color: #333;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="container navbar-content">
        <a href="index.html" class="nav-logo">🎓 Smart Event Portal</a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="EventListing.html">Events</a></li>
          <li><a href="dashboard.html" class="active">Dashboard</a></li>
          <li><a href="feedbackForm.html">Contact & Feedback</a></li>
          <li><button id="themeToggle" class="theme-btn">🌓</button></li>
        </ul>
      </div>
    </nav>

    <main class="dashboard-container">
      <h1 class="section-title">Participant Dashboard</h1>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Registrations</h3>
          <div class="value" id="totalReg">0</div>
        </div>
        <div class="stat-card">
          <h3>Next Event Countdown</h3>
          <div class="value" id="countdown">--:--:--</div>
          <p id="nextEventName" style="color: #94a3b8; font-size: 0.9rem">
            No upcoming events
          </p>
        </div>
      </div>

      <h2 style="margin-bottom: 20px">My Registered Events</h2>
      <div class="reg-list" id="regList">
        <!-- Registered events populated here -->
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 Smart Event Portal. All rights reserved.</p>
      </div>
    </footer>

    <script>
      function initDashboard() {
        const registrations =
          JSON.parse(localStorage.getItem("registrations")) || [];
        document.getElementById("totalReg").textContent = registrations.length;

        const listContainer = document.getElementById("regList");
        if (registrations.length === 0) {
          listContainer.innerHTML =
            "<p>You haven't registered for any events yet.</p>";
        } else {
          listContainer.innerHTML = registrations
            .map(
              (r) => `
            <div class="card">
              <div class="card-content">
                <h3>${r.eventName}</h3>
                <span class="category${r.eventCategory}">${r.eventCategory}</span>
                <p style="margin-top: 10px;">📅 ${new Date(r.eventDate).toDateString()}</p>
                <p style="font-size: 0.8rem; color: #666;">Reg ID: ${r.registrationId}</p>
              </div>
            </div>
          `,
            )
            .join("");
        }

        startCountdown(registrations);
      }

      function startCountdown(registrations) {
        const now = new Date();
        const upcoming = registrations
          .map((r) => ({ ...r, dateObj: new Date(r.eventDate) }))
          .filter((r) => r.dateObj > now)
          .sort((a, b) => a.dateObj - b.dateObj);

        if (upcoming.length > 0) {
          const nextEvent = upcoming[0];
          document.getElementById("nextEventName").textContent =
            nextEvent.eventName;

          const timer = setInterval(() => {
            const currentTime = new Date().getTime();
            const distance = nextEvent.dateObj.getTime() - currentTime;

            if (distance < 0) {
              clearInterval(timer);
              document.getElementById("countdown").textContent = "STARTED";
              return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor(
              (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
            );
            const minutes = Math.floor(
              (distance % (1000 * 60 * 60)) / (1000 * 60),
            );
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("countdown").textContent =
              `${days}d ${hours}h ${minutes}m ${seconds}s`;
          }, 1000);
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        initDashboard();

        const themeBtn = document.getElementById("themeToggle");
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);

        themeBtn.addEventListener("click", () => {
          const current = document.documentElement.getAttribute("data-theme");
          const target = current === "dark" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", target);
          localStorage.setItem("theme", target);
        });
      });
    </script>
  </body>
</html>
